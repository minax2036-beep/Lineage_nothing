name: Build Galaxian Recovery

on:
  workflow_dispatch: # ブラウザから手動でポチッと起動できるようにする設定

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@main
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils lzop python3 unzip zip

      - name: Install Repo
        run: |
          mkdir ~/bin
          curl https://googleapis.com > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

      - name: Sync LineageOS & Galaxian Tree
        run: |
          export PATH=~/bin:$PATH
          mkdir lineage && cd lineage
          repo init -u https://github.com -b lineage-24.0 --git-lfs
          
          # Andreyka445氏の設計図を配置
          git clone https://github.com/Andreyka445/device_nothing_Galaxian -b lineage-24.0 device/nothing/Galaxian
          
          # ここにNothing Archiveから持ってきたFull OTAのURLを置いて解体するコマンドを追記します
          https://archive.org/download/nothing-archive/spike0en/fullota/galaxian/Galaxian_B4.1-260819-1839.zip
